<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>ChatGPT 发送失败验收页</title>
  <link rel="icon" href="../assets/logos/chatgpt.png">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f4f4f0; color:#202123; font-family:"Segoe UI","Microsoft YaHei UI",sans-serif; }
    main { width:min(760px,calc(100vw - 40px)); } h1 { margin:0 0 10px; font-size:24px; } p { margin:0 0 22px; color:#6b6c68; }
    .composer { position:relative; padding:14px 58px 14px 17px; border:1px solid #c9cac4; border-radius:24px; background:#fff; box-shadow:0 18px 50px rgba(0,0,0,.1); }
    #prompt-textarea { min-height:90px; outline:0; white-space:pre-wrap; line-height:1.55; }
    button { position:absolute; right:13px; bottom:13px; width:38px; height:38px; border:0; border-radius:50%; background:#111; color:#fff; }
    .error { margin-top:14px; padding:10px 13px; border-radius:10px; color:#922; background:#fbe8e8; }
  </style>
</head>
<body>
  <main><h1>ChatGPT 网页异常场景</h1><p>按 Enter 后页面模拟请求失败，输入框不会清空。</p><div class="composer"><div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Message ChatGPT"></div><button data-testid="send-button" aria-label="Send prompt">↑</button></div><div class="error">发送失败，请稍后重试</div></main>
  <script>
    globalThis.__AIH_TEST_OPEN_SHADOW = true;
    const memory = {};
    globalThis.chrome = { runtime:{ lastError:null }, storage:{ local:{ get(key, callback){ callback({[key]:memory[key]}); }, set(value, callback){ Object.assign(memory,value); callback(); } } } };
  </script>
<script src="../src/history-store.js"></script><script src="../src/i18n.js"></script><script src="../src/site-profiles.js"></script>
  <script>AIInputHistory.SiteProfiles.forSite("chatgpt.com").domains.push("127.0.0.1");</script>
<script src="../src/site-icon.js"></script><script src="../src/input-adapter.js"></script><script src="../src/history-navigator.js"></script><script src="../src/draggable.js"></script><script src="../src/send-detector.js"></script><script src="../src/site-filter.js"></script><script src="../src/theme-observer.js"></script><script src="../src/history-panel-utils.js"></script><script src="../src/clear-confirmation.js"></script><script src="../src/history-panel.js"></script><script src="../src/content.js"></script>
  <script>
    document.querySelector("#prompt-textarea").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) event.preventDefault();
    });
  </script>
</body>
</html>
