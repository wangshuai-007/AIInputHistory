<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
<head><meta charset="utf-8"><title>深色模式验收页</title><style>html{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1110;color:#eef4ef;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}main{width:680px}textarea{box-sizing:border-box;width:100%;height:140px;padding:18px;border:1px solid #34423a;border-radius:18px;background:#161d19;color:#eef4ef;font:15px/1.5 inherit}</style></head>
<body><main><h1>深色 AI 页面</h1><textarea aria-label="深色模式输入框" placeholder="输入内容"></textarea></main>
  <script>
    globalThis.__AIH_TEST_OPEN_SHADOW = true;
    const memory={aiInputHistorySettings:{historyLimit:100,sendLimit:10,snapshotSeconds:60,launcherEnabled:true,customDomains:["127.0.0.1"]}};
    globalThis.chrome={runtime:{lastError:null},storage:{local:{get(key,callback){callback({[key]:memory[key]});},set(value,callback){Object.assign(memory,value);callback();}}}};
  </script>
  <script src="../src/history-store.js"></script><script src="../src/site-profiles.js"></script><script src="../src/site-icon.js"></script><script src="../src/input-adapter.js"></script><script src="../src/draggable.js"></script><script src="../src/send-detector.js"></script><script src="../src/site-filter.js"></script><script src="../src/theme-observer.js"></script><script src="../src/history-panel.js"></script><script src="../src/content.js"></script>
</body>
</html>
