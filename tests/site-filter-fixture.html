<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AI 网站筛选验收页</title>
  <style>
    :root { --bg:#111713; --surface:#19211c; --line:#304036; --text:#f0f5f1; --muted:#9aaba0; --accent-strong:#a6efbd; font-family:"Segoe UI","Microsoft YaHei UI",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; background:#eaf0ec; color:var(--text); }
    main { width:360px; padding:18px; border:1px solid var(--line); border-radius:18px; background:var(--bg); box-shadow:0 22px 60px rgba(0,0,0,.25); }
    h1 { margin:0 0 14px; font-size:16px; } .site-filter-host { position:relative; }
    .site-trigger { width:100%; height:38px; border:1px solid var(--line); border-radius:10px; padding:0 10px; background:var(--surface); color:var(--text); display:flex; align-items:center; gap:8px; cursor:pointer; }
    .site-trigger span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .chevron { width:14px; margin-left:auto; }
    .site-menu { position:absolute; z-index:2; top:44px; left:0; width:100%; max-height:270px; overflow:auto; padding:6px; border:1px solid var(--line); border-radius:12px; background:var(--bg); box-shadow:0 16px 38px rgba(0,0,0,.34); }
    .hidden { display:none; } .site-option { width:100%; border:0; border-radius:9px; padding:9px; background:transparent; color:var(--text); display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer; }
    .site-option:hover,.site-option.selected { background:var(--surface); } .site-option>span { display:flex; flex-direction:column; gap:2px; }
    .site-option strong { font-size:13px; } .site-option small { color:var(--muted); font-size:10px; }
    .ai-logo { width:18px; height:18px; flex:0 0 auto; color:var(--muted); fill:currentColor; object-fit:contain; border-radius:4px; }
    .ai-logo.gemini { color:#7188f5; } .ai-logo.grok { color:var(--text); } .ai-logo.glm { color:#4ea5ff; } .ai-logo.qwen { color:#8c69ef; } .ai-logo.all { color:var(--accent-strong); }
    .ai-logo.chatgpt { color:#10a37f; } .ai-logo.claude { color:#d97757; } .ai-logo.aistudio { color:#4285f4; } .ai-logo.deepseek { color:#4d6bfe; }
    #selection { margin-top:16px; color:var(--muted); font-size:11px; }
  </style>
</head>
<body>
  <main><h1>按 AI 网站过滤</h1><div class="site-filter-host"></div><div id="selection"></div></main>
  <script src="../src/site-profiles.js"></script>
  <script src="../src/site-filter.js"></script>
  <script>
    const output = document.querySelector("#selection");
    const filter = new AIInputHistory.SiteFilter(document.querySelector(".site-filter-host"), "gemini.google.com", (site) => { output.textContent = `已选择：${site}`; });
    filter.setSites(["gemini.google.com", "claude.ai", "aistudio.google.com", "chat.deepseek.com", "chatgpt.com", "grok.com", "chat.z.ai", "chat.qwen.ai"]);
  </script>
</body>
</html>
