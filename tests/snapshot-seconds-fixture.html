<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>秒级快照验收页</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3ef;font-family:"Segoe UI","Microsoft YaHei UI",sans-serif}main{width:680px}textarea{box-sizing:border-box;width:100%;height:140px;padding:18px;border:1px solid #aebdb2;border-radius:18px;font:15px/1.5 inherit}</style></head>
<body><main><h1>1 秒自动快照</h1><textarea aria-label="秒级快照输入框" placeholder="输入后等待一秒"></textarea></main>
  <script>
    globalThis.__AIH_TEST_OPEN_SHADOW = true;
    const memory = { aiInputHistorySettings:{ historyLimit:100,sendLimit:10,snapshotSeconds:1,launcherEnabled:true,customDomains:["127.0.0.1"] } };
    globalThis.chrome = { runtime:{lastError:null}, storage:{local:{get(key,callback){callback({[key]:memory[key]});},set(value,callback){Object.assign(memory,value);callback();}}} };
  </script>
  <script src="../src/history-store.js"></script><script src="../src/site-profiles.js"></script><script src="../src/site-icon.js"></script><script src="../src/input-adapter.js"></script><script src="../src/draggable.js"></script><script src="../src/send-detector.js"></script><script src="../src/site-filter.js"></script><script src="../src/theme-observer.js"></script><script src="../src/history-panel.js"></script><script src="../src/content.js"></script>
</body>
</html>
